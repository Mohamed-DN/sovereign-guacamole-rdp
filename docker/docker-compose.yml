version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: guacamole-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: guacamole
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guac_db_secure_pass_2026}
      POSTGRES_DB: guacamole_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # The magic: Mount our SQL scripts to auto-run on first boot!
      - ../scripts/sql:/docker-entrypoint-initdb.d:ro
    networks:
      - guac_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guacamole -d guacamole_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  guacd:
    image: guacamole/guacd:latest
    container_name: guacamole-guacd
    restart: unless-stopped
    user: "1000:1000"
    volumes:
      # Map the drive for RDP bidirectional file transfer
      - ./drive:/var/lib/guacamole/drive:rw
    networks:
      - guac_network

  guacamole:
    image: guacamole/guacamole:latest
    container_name: guacamole-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080" # Only expose to localhost, NPM will reverse proxy this
    environment:
      GUACD_HOSTNAME: guacd
      POSTGRES_HOSTNAME: postgres
      POSTGRES_DATABASE: guacamole_db
      POSTGRES_USER: guacamole
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guac_db_secure_pass_2026}
      # Set proper URI for reverse proxy
      # OIDC variables can be uncommented for Authentik integration
      # EXTENSIONS: auth-sso-openid
      # OPENID_AUTHORIZATION_ENDPOINT: https://auth.yourdomain.com/application/o/guacamole/authorize/
      # OPENID_JWKS_ENDPOINT: https://auth.yourdomain.com/application/o/guacamole/jwks/
      # OPENID_ISSUER: https://auth.yourdomain.com/application/o/guacamole/
      # OPENID_CLIENT_ID: guacamole
      # OPENID_REDIRECT_URI: https://guacamole.yourdomain.com/guacamole/
    depends_on:
      postgres:
        condition: service_healthy
      guacd:
        condition: service_started
    networks:
      - guac_network

volumes:
  postgres_data:

networks:
  guac_network:
    driver: bridge
